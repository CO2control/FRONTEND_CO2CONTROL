<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas - CO2</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/alertas.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="logo">
                <img src="./assets/logo.png" alt="Logo">
            </div>

            <div class="menu">
                <a href="dashboard.html">
                    <div class="item"><img src="./assets/iconNav.png" alt="">
                        <p>Dashboard</p>
                    </div>
                </a>
                
                <div class="item"><img src="./assets/alerta.png" alt=""><span>Alertas</span></div>
                
                <a href="../index.html">
                    <div class="item">
                        <img src="./assets/porta.png" alt="">
                        <p>Sair</p>
                    </div>
                </a>
            </div>
        </div>
        <!-- MAIN -->
        <div class="main">
            <div class="main-header">
                <div class="alerts-header">
                    <div>
                        <h1 style="color: #5a0a0a;">Alertas - <span class="red-text" id="empresa_name">(Nome da vinicola)</span></h1>
                        <p>Exibindo <b><span class="black-text" id="alert_count">4</span></b> alertas no total.</p>
                    </div>
                    <select class="filter-select" id="filter_select" onchange="exibirAlertas(filter_select.value);">
                        <option disabled>Filtrar por:</option>
                        <option selected value="1">Nível</option>
                        <option value="2">Local</option>
                    </select>
                </div>
            </div>
            <div class="alerts" id="alerts_div">
            </div>
        </div>
    </div>
</body>
</html>
<script>
    function exibirAlertas(filter_param) {
        fetch(`/alertas/buscarAlertasPorIdEmpresa/${sessionStorage.ID_EMPRESA}/${filter_param}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO exibirAlertas()!")

            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log(json)
                    alerts_div.innerHTML = "";
                    empresa_name.innerHTML = json[0].razao_social;
                    alert_count.innerHTML = json.length;
                    for(let i=0;i<json.length;i++) {
                        alerts_div.innerHTML += `
                        <div id="alerts_card_${i}" class="alert-card">
                            <div id="alert_status_color_${i}" class="alert-critical-status-color"></div>
                            <div class="alert-content">
                                <div class="alert-summary">
                                    <h3>Alerta - <span class="black-text" id="div_alert_id_${i}">001</span></h3>
                                    <h3>Tanque - <span class="black-text" id="div_container_name_${i}">001</span></h3>
                                    <h3>Local - <span class="black-text" id="div_location_${i}">Bloco C</span></h3>
                                </div>
                                <div class="alert-details">
                                    <div class="alert-level-box">
                                        <div class="alert-level-div">
                                            <h3>Nível: <span class="black-text" id="div_alert_level_${i}">Crítico</span></h3>
                                        </div>
                                        <div class="alert-level-value">
                                            <h2><span class="black-text" id="div_alert_value_${i}">80%</span></h2>
                                        </div>
                                    </div>
                                    <div class="alert-level-box">
                                        <div class="alert-level-div">
                                            <h3>Momento:</h3>
                                        </div>
                                        <div class="alert-time-value">
                                            <h2><span class="black-text" id="div_alert_time_${i}">17:53</span></h2>
                                            <h2><span class="black-text" id="div_alert_date_${i}">13/05/2026</span></h2>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>`;

                        if(json[i].nivel == "CRITICO") {
                            document.getElementById(`alert_status_color_${i}`).classList.add("alert-critical-status-color")
                        } else {
                            document.getElementById(`alert_status_color_${i}`).classList.add("alert-high-status-color")
                        }

                        let data = new Date(json[i].data_alerta).toLocaleDateString('pt-BR');

                        document.getElementById(`div_alert_id_${i}`).innerHTML = json[i].id;
                        document.getElementById(`div_container_name_${i}`).innerHTML = json[i].nome_identificador;
                        document.getElementById(`div_location_${i}`).innerHTML = json[i].local_tanque;
                        document.getElementById(`div_alert_level_${i}`).innerHTML = json[i].nivel;
                        document.getElementById(`div_alert_value_${i}`).innerHTML = json[i].nivel_carbono;
                        document.getElementById(`div_alert_time_${i}`).innerHTML = json[i].hora_alerta;
                        document.getElementById(`div_alert_date_${i}`).innerHTML = data;
                     }
                });

            } else {
                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

       
    exibirAlertas();

        setInterval(() => {
            exibirAlertas();
        }, 1000);
    }
    exibirAlertas(filter_select.value);
</script>
