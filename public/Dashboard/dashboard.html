    <script>

        window.onload = () => {
            kpiSensor()
            kpiAlerta()
            mostrarCards()
    }

    function kpiSensor() {
        var idEmpresa = sessionStorage.ID_EMPRESA;
        fetch(`/geral/sensores/${idEmpresa}`).then((resposta) => {
            if (resposta.ok) { 
                resposta.json().then((dados) => {
                    sensorMostrar.innerHTML = `${dados[0].sensores_ativos}/${dados[0].total_sensores}`
                })
            }
        })
    }

    function kpiAlerta() {
        var idEmpresa = sessionStorage.ID_EMPRESA;
        fetch(`/geral/alertas/${idEmpresa}`).then((resposta) => {
            if (resposta.ok) { 
                resposta.json().then((dados) => {
                    sensorAlerta.innerHTML = `${dados[0].alertas_hoje}`
                })
            }
        })
    }

    function mostrarCards() {
        var idEmpresa = sessionStorage.ID_EMPRESA;

        fetch(`/geral/cards/${idEmpresa}`).then((resposta) => {
            if (resposta.ok) {
                
                resposta.json().then(function (dados) {
                    
                    console.log(`Dados recebidos: ${JSON.stringify(dados)}`);
                    for(let i = 0; i < dados.length; i++){
                        let estilo 
                     if(dados[i].nivel > 60){
                            estilo = "etiqueta_vermelho"
                        }else if(dados[i].nivel < 20){
                            estilo = "etiqueta_amarelo";
                        }else{
                            estilo = "etiqueta_verde";
                        }
                        div_cards.innerHTML +=`
                            <div class="elemento_lista">
                            <div class="head_elemento_lista">
                                <div class="${estilo}"></div>
                                ${dados[i].tanque}
                            </div>
                            <div class="corpo_elemento_lista">
                                <span><img src="Captura de tela 2026-05-17 104101.png" alt=""><span class="negrito">Nível:</span>${dados[i].nivel}</span>
                                <span><img src="Captura de tela 2026-05-17 104133.png" alt=""><span class="negrito">Localização:</span>${dados[i].localizacao}</span>
                                <span><img src="Captura de tela 2026-05-17 105543.png" alt=""><span class="negrito">Último alerta:</span>${dados[i].ultimo_alerta}</span>
                            </div>
                        `;

                    }
                

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    

    }
