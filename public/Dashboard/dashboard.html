<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard CO2</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="logo">
                <img src="./assets/logo.png" alt="Logo">
            </div>

            <div class="bem-vindo">
                <h3>Seja bem vindo(a), <span id="nome_usuario"></span>!</h3>
            </div>

            <div class="menu">
                <a href="dashboard.html">
                    <div class="item">
                        <img src="./assets/iconNav.png" alt="">
                        <p>Dashboard</p>
                    </div>
                </a>
                <a href="alertas.html">
                    <div class="item">
                        <img src="./assets/alerta.png" alt="">
                        <p>Alertas</p>
                    </div>
                </a>
                <a href="../index.html">
                    <div class="item sair">
                        <img src="./assets/porta.png" alt="">
                        <p>Sair</p>
                    </div>
                </a>
            </div>
        </div>

        <div class="main">
            <!-- KPIs -->
            <div class="kpis">
                <div class="kpi kpi-verde">
                    <div class="kpi-title"><span>Sensores Ativos</span></div>
                    <div class="kpi-value" id="sensorMostrar"></div>
                    <img src="./assets/wi-fi.png" alt="">
                </div>
                <div class="kpi kpi-amarela">
                    <div class="kpi-title"><span>Tanques em Alertas</span></div>
                    <div class="kpi-value" id="tanqueAlerta"></div>
                    <img src="./assets/alertaColor.png" alt="">
                </div>
                <div class="kpi kpi-vermelha">
                    <div class="kpi-title"><span>Tanque com Maior Variação</span></div>
                    <div class="kpi-value" id="variacao"></div>
                    <img src="./assets/armazenamentoIndivdual.png" alt="">
                </div>
                
                <div class="kpi">
                    <div class="kpi-title"><span>Alertas Hoje</span></div>
                    <div class="kpi-value" id="sensorAlerta"></div>
                    <img src="./assets/alarme.png" alt="">
                </div>
            </div>


            <div class="content">
                <div id="lista">
                    <div class="lista-header">
                        <div class="titulo-wrapper">
                            <img class="tempoReal" src="simboloVerde.png" alt="">
                            <h2 id="head_lista">Todos os tanques</h2>
                            <a href="cadastro-tanque.html"><button class="button3">CADASTRAR TANQUE</button></a>
                        </div>
                        
                        <div class="controles-wrapper">
                            <input type="text" id="ipt_pesq" placeholder="Digite o nome do seu tanque">
                            <button class="button1" onclick="pesquisarNome()">PESQUISAR</button>
                            <select id="ipt_filtro" class="button2" onchange="filtrarTanques()"> 
                                <!-- onchange chama a função automaticamente -->
                                <option value="x">FILTRAR</option>
                                <option value="3">Bom</option>
                                <option value="4">Abaixo</option>
                                <option value="5">Alto</option>
                                <option value="6">Crítico</option>
                            </select>
                            
                        </div>
                    </div>
                    <div id="div_cards" class="tanques_lista">
                    </div>

                </div>

                <!-- ALERTAS -->
             <div class="alerts">
    <div class="titulo">ALERTAS - <span id="data"></span></div>

    <div id="alertaX"></div>
</div>
        </div>
    </div>
    <script>

        nome_usuario.innerHTML = sessionStorage.NOME_USUARIO;

        let data = new Date();
        document.getElementById("data").innerHTML = data.toLocaleDateString("pt-BR");


        let listaTanques = [];

        window.onload = () => {
            kpiSensor()
            kpiAlerta()
            mostrarCards()
            mostrarAlerta()
            kpiTanqueAlerta()
            kpiVariacao()
    }

    function kpiSensor() {
        var idEmpresa = sessionStorage.ID_EMPRESA;
        fetch(`/geral/sensores/${idEmpresa}`).then((resposta) => {
            if (resposta.ok) { 
                resposta.json().then((dados) => {
                    sensorMostrar.innerHTML = `${dados[0].sensores_ativos}/${dados[0].total_sensores}`
                })
            }
        })
    }

    function kpiAlerta() {
        var idEmpresa = sessionStorage.ID_EMPRESA;
        fetch(`/geral/alertas/${idEmpresa}`).then((resposta) => {
            if (resposta.ok) { 
                resposta.json().then((dados) => {
                    sensorAlerta.innerHTML = `${dados[0].alertas_hoje}`
                })
            }
        })
    }

     function kpiVariacao() {
        var idEmpresa = sessionStorage.ID_EMPRESA;
        fetch(`/geral/alertas4/${idEmpresa}`).then((resposta) => {
            if (resposta.ok) { 
                resposta.json().then((dados) => {
                    variacao.innerHTML = `${dados[0].nome_identificador}`
                })
            }
        })
    }

    function kpiTanqueAlerta() {
        var idEmpresa = sessionStorage.ID_EMPRESA;
        fetch(`/geral/tanqueAlertas/${idEmpresa}`).then((resposta) => {
            if (resposta.ok) { 
                resposta.json().then((dados) => {
                    tanqueAlerta.innerHTML = `${dados[0].tanques_com_alerta}`
                })
            }
        })
    }

    function mostrarAlerta() {
        var idEmpresa = sessionStorage.ID_EMPRESA;
        
        fetch(`/geral/alertas2/${idEmpresa}`).then((resposta) => {
            if (resposta.ok) {
                
                resposta.json().then(function (dados) {
                    alertaX.innerHTML = "";
                    
                    console.log(`Dados recebidos: ${JSON.stringify(dados)}`);
                    for(let i = 0; i < dados.length; i++){
                
                        alertaX.innerHTML +=`<a href="alertas.html">
                            <div class="alert">
                        <span class="xxx">${dados[i].tanque}</span> - 
                        <span>${dados[i].mensagem}</span> - 
                        <span>${dados[i].nivel}</span> - 
                        <span>${dados[i].data_alerta}</span>
                    </div>
                            </a>`;
                    }
                

                });
            }
        })
    }




    function mostrarCards() {
        var idEmpresa = sessionStorage.ID_EMPRESA;

        fetch(`/geral/cards/${idEmpresa}`).then((resposta) => {
            if (resposta.ok) {
                
                resposta.json().then(function (dados) {
                    listaTanques = dados;
                    
                    console.log(`Dados recebidos: ${JSON.stringify(dados)}`);
                    listaTanques = dados;

                    renderizarCards(dados);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    

    }

    kpiSensor();
    kpiAlerta();
    kpiVariacao();
    mostrarAlerta();
    kpiTanqueAlerta();

        setInterval(() => {
            kpiSensor();
            kpiAlerta();
            kpiVariacao();
            mostrarAlerta();
            kpiTanqueAlerta();
        }, 1000);

    function abrirTanque(idArmazenamento){

        sessionStorage.ID_ARMAZENAMENTO = idArmazenamento;
        window.location.href = "tanques.html";
    }

    function renderizarCards(dados) {
    div_cards.innerHTML = "";

    for(let i = 0; i < dados.length; i++) {
       let estilo;



let corNivel;

if (dados[i].nivel < 20) {
    estilo = "etiqueta_amarelo";
    corNivel = "#fbc02d";
} 
else if (dados[i].nivel <= 40) {
    estilo = "etiqueta_verde";
    corNivel = "#2e7d32";
} 
else if (dados[i].nivel <= 60) {
    estilo = "etiqueta_laranja";
    corNivel = "#f57c00";
} 
else {
    estilo = "etiqueta_vermelho";
    corNivel = "#c62828";
}

if(dados[i].nivel >= 0){
    div_cards.innerHTML += `
            <div onclick= "pegarid(${dados[i].id})" class="elemento_lista">
                <div class="head_elemento_lista">
                    <div class="${estilo}"></div>${dados[i].tanque}</div>
                <div class="corpo_elemento_lista">
                    <p style="color:${corNivel}">${dados[i].nivel}%</p>
                    <span><span class="negrito">Localização:</span>${dados[i].localizacao}</span>
                    <span><span class="negrito">Último alerta:</span>${dados[i].ultimo_alerta}</span>
                </div>
            </div>
        `;
} else {
    div_cards.innerHTML += `
            <div onclick= "pegarid(${dados[i].id})" class="elemento_lista">
                <div class="head_elemento_lista">
                    <div class="${estilo}"></div>${dados[i].tanque}</div>
                <div class="corpo_elemento_lista">
                    <p style="color:${corNivel}">${dados[i].nivel}</p>
                    <span><span class="negrito">Localização:</span>${dados[i].localizacao}</span>
                    <span><span class="negrito">Último alerta:</span>${dados[i].ultimo_alerta}</span>
                </div>
            </div>
        `;
}
        
    }
}

function pegarid(id){
    window.location.href = `tanques.html?id=${id}`
}

function pesquisarNome() {
    let pesquisa = ipt_pesq.value.toLowerCase();
    let resultado = [];

    for(let i = 0; i < listaTanques.length; i++) {
        if(listaTanques[i].tanque.toLowerCase().includes(pesquisa)) {
            resultado.push(listaTanques[i]);
        }
    }

    renderizarCards(resultado);
}

 function filtrarTanques() {
    let filtro = ipt_filtro.value;
    let resultado = [];

    for (let i = 0; i < listaTanques.length; i++) {

        if (filtro == "x") {
            resultado.push(listaTanques[i]);
        }

        else if (filtro == "4" && listaTanques[i].nivel < 20) {
            resultado.push(listaTanques[i]);
        }

        else if (filtro == "3" && listaTanques[i].nivel>= 20 && listaTanques[i].nivel<= 40) {
            resultado.push(listaTanques[i]);
        }

        else if (filtro == "5" && listaTanques[i].nivel> 40 && listaTanques[i].nivel<= 60) {
            resultado.push(listaTanques[i]);
        }

        else if (filtro == "6" && listaTanques[i].nivel> 60) {
            resultado.push(listaTanques[i]);
        }
    }

    renderizarCards(resultado);
}
    </script>

</body>

</html>
