<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Armazenamento | Sistema Industrial</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/cadastro-tanque.css">
    
</head>

<body>

<div class="sair">
    <a href="tanques.html">
        <button>EXIT</button>
    </a>
</div>

<div class="conteudo-cadastro">

    <div class="cadastro-titulo">
        <h1>Atualize o seu Armazenamento</h1>
    </div>

<div>
    <div class="inputs-cadastro">
        <span>Novo Nome</span>
        <input type="text" id="ipt_nomeIdentificador">

        <span>Localização do Tanque</span>
        <input type="text" id="ipt_local">

    <div class="status-uso">
        <span>Status de Uso</span>
        <select id="utilizacao" name="utilizacao" required>
            <option value="1">Em Uso (Ativo)</option>
            <option value="0">Disponível (Inativo)</option>
        </select>
    </div>

    <button onclick="atualizarTanque()" class="botao-salvar">
        Salvar Registro
    </button>
    

</div>

</body>
</html>
<script>

function atualizarTanque(){

    let nome = document.getElementById("ipt_nomeIdentificador").value;
    let localizacao = document.getElementById("ipt_local").value;
    let utilizacao = document.getElementById("utilizacao").value;


    if(nome == '' || localizacao == ''){
        alert("Preencha todos os campos")
        return;
    }

    fetch(`/tanques/atualizarTanque/${sessionStorage.ID_EMPRESA}`,{

            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                nomeServer: nome,
                localServer: localizacao,
                utilizacaoServer: utilizacao,
                idArmazenamentoServer: sessionStorage.ID_ARMAZENAMENTO
            })
        })
        .then(function (resposta) {

            console.log("Resposta:", resposta);

            if (resposta.ok) {
                alert("Tanque atualizado com sucesso");
                setTimeout(() => {
                    window.location.href = "tanques.html";
                }, 1000);
            } else {
                alert ("Erro ao atualizar tanque");
            }
        })
        .catch(function (erro) {
            console.log(`erro`);
        });

}


</script>
