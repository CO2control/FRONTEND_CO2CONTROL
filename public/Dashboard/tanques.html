<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanques - CO2</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tanques.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="superior">

        <div class="botao-tanque">
            <a onclick="editarArmazenamento()" class="botoes">
                <span>Atualizar Tanque</span>
            </a>


            <a onclick="excluir()" class="botoes">
                <span>Excluir Tanque</span>
            </a>
        </div>

        <div class="botao-sair">
            <a href="dashboard.html" class="botoes">
                <span>EXIT</span>
            </a>
        </div>
    </div>


    <!-- MAIN -->
    <div class="main">

        <!-- KPIs -->
        <div class="kpis">

            <div class="kpi sombra-preta">
                <div class="kpi-title"><span>Tanque</span></div>
                <div class="kpi-value">
                    <span id="kpiNome"></span>
                </div>
                <img src="./assets/wi-fi.png">
            </div>

            <div class="kpi" id="kpiMaximo">
                <div class="kpi-title"><span>Máximo Atingido</span></div>
                <div class="kpi-value">
                    <span id="kpiValorMaximo"></span>
                </div>

                <div class="kpi-hora">
                    <span id="ultimaMedicao"></span>
                </div>
            </div>

            <div class="kpi" id="kpiCorTendencia">
                <div class="kpi-title"><span>Tendência atual</span></div>
                <img id="imgTendencia" alt="Tendência">
                <div class="kpi-value">
                    <span id="kpiTendencia"></span>
                </div>
            </div>

            <div class="kpi" id="kpiCorAlerta">
                <div class="kpi-title">
                    <span>Alertas emitidos hoje</span>
                </div>
                <div class="kpi-value">
                    <span id="kpiAlertas"></span>
                </div>
                <div class="kpi-hora">
                    <span id="ultimoAlerta"></span>
                </div>
            </div>

        </div>



        <!-- CONTEÚDO -->
        <div class="content">

            <!-- GRÁFICOS -->
            <div class="charts">

                <div class="chart-um">
                    <div class="titulo">
                        <span>Nível de CO2 - </span>
                        <span id="dataAtual"></span>
                    </div>
                    <canvas id="chart1"></canvas>
                </div>

                <div class="chart-dois">
                    <div class="titulo">
                        <span>Nível Atual</span>
                    </div>
                    <canvas id="chart2"></canvas>
                    <div class="kpi-value">
                        <span id="statusCO2"></span>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
<script>

    function editarArmazenamento() {
        sessionStorage.ID_ARMAZENAMENTO = idArmazenamentoAtual;
        window.location = "atualizar-tanques.html";
    }

    function excluir() {
        if (!confirm('Tem certeza que deseja excluir este tanque?')) {
            return;
        } else {
            fetch(`/tanques/excluirTanque/${sessionStorage.ID_ARMAZENAMENTO}`, {
                method: "DELETE"
            })
                .then(function (resposta) {

                    if (resposta.ok) {
                        alert("Tanque excluído com sucesso!");
                        window.location = "dashboard.html";
                    }
                    else {
                        alert("Erro ao excluir tanque");
                    }

                })
                .catch(function (erro) {
                    console.log(erro);
                });

        }
    }


    Chart.defaults.color = '#000';

    let idArmazenamentoAtual;
    let graficoLinha;
    let graficoMeiaLua;

    let data = new Date();
    document.getElementById("dataAtual").innerHTML = data.toLocaleDateString("pt-BR");



    fetch(`/tanques/buscarKPIs/${sessionStorage.ID_EMPRESA}/${sessionStorage.ID_ARMAZENAMENTO}`)

        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {

            console.log(dados);


            if (dados.length == 0) {
                return;
            }

            sessionStorage.ID_ARMAZENAMENTO = dados[0].idArmazenamento;
            idArmazenamentoAtual = dados[0].idArmazenamento;
            kpiNome.innerHTML = dados[0].nome;
            kpiValorMaximo.innerHTML = Number(dados[0].maximo).toFixed(1) + '%';
            kpiAlertas.innerHTML = dados[0].alertas;


            let corKpiMaximo = document.getElementById("kpiMaximo");
            if (dados[0].maximo < 20 || dados[0].maximo > 40) {
                corKpiMaximo.classList.add("sombra-vermelha")
            } else {
                corKpiMaximo.classList.add("sombra-verde")
            }


            let horaMaximo = new Date(dados[0].data_maximo);

            document.getElementById("ultimaMedicao").innerHTML = ` Dia ${horaMaximo.toLocaleDateString('pt-BR')} `;
            document.getElementById("ultimaMedicao").innerHTML += ` ás ${horaMaximo.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}h `;

            if (dados[0].ultimo_alerta) {

                let horaAlerta = new Date(dados[0].ultimo_alerta);

                document.getElementById("ultimoAlerta").innerHTML =
                    `Último alerta ás ${horaAlerta.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}h`;
            }


            let corKpiAlerta = document.getElementById("kpiCorAlerta");
            if (dados[0].alertas == 0) {
                corKpiAlerta.classList.add("sombra-verde")
            } else if (dados[0].alertas <= 2) {
                corKpiAlerta.classList.add("sombra-amarela")
            } else {
                corKpiAlerta.classList.add("sombra-vermelha")
            }

        });



    fetch(`/tanques/buscarTendencia/${sessionStorage.ID_EMPRESA}/${sessionStorage.ID_ARMAZENAMENTO}`)
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {

            console.log(dados);

            if (dados.length < 2) {
                return;
            }

            let atual = Number(dados[0].nivel_carbono);
            let anterior = Number(dados[1].nivel_carbono);
            let tendencia = '';
            let imagemTendencia = document.getElementById("imgTendencia");
            let corKpiTendencia = document.getElementById("kpiCorTendencia");


            if (atual > anterior) {
                tendencia = "Aumentar";
                imagemTendencia.src = "./assets/seta-para-cima.png"
                corKpiTendencia.classList.add("sombra-amarela")
            }
            else if (atual < anterior) {
                tendencia = "Diminuir";
                imagemTendencia.src = "./assets/seta-para-baixo.png"
                corKpiTendencia.classList.add("sombra-amarela")
            }
            else {
                tendencia = "Estável";
                imagemTendencia.src = "./assets/seta-estavel.png"
                corKpiTendencia.classList.add("sombra-verde")
            }

            kpiTendencia.innerHTML = tendencia;

        });

    buscarGraficoLinha();
    buscarGraficoMeiaLua();

        setInterval(() => {
            buscarGraficoLinha();
            buscarGraficoMeiaLua();
        }, 2000);



    function buscarGraficoLinha() {

        fetch(`/tanques/buscarGrafico1/${sessionStorage.ID_EMPRESA}/${sessionStorage.ID_ARMAZENAMENTO}`)
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (dados) {

                console.log(dados);

                if (dados.length == 0) {
                    return;
                }

                let nomes = [];
                let valores = [];

                for (let i = 0; i < dados.length; i++) {

                    let data = new Date(dados[i].data_registro);
                    let hora = data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                    nomes.push(hora);
                    valores.push(Number(dados[i].nivel_carbono));
                }

                criarGraficoLinha(nomes, valores);
            });
    }


    
    function buscarGraficoMeiaLua() {

        fetch(`/tanques/buscarGrafico2/${sessionStorage.ID_EMPRESA}/${sessionStorage.ID_ARMAZENAMENTO}`)
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (dados) {

                console.log(dados);

                if (dados.length == 0) {
                    return;
                }

                let maximo = 100;
                let co2Atual = dados[0].nivel_carbono;
                let restante = maximo - co2Atual;

                criarGraficoMeiaLua(co2Atual, restante);


                let status = "";

                if (co2Atual < 20) {
                    status = "Baixo";
                }
                else if (co2Atual <= 40) {
                    status = "Ideal";
                }
                else {
                    status = "Alto";
                }

                document.getElementById("statusCO2").innerHTML = `Status: ${status}`;
            });
    }



    function criarGraficoLinha(nomes, valores) {

        if (graficoLinha) {
            graficoLinha.data.labels = nomes;
            graficoLinha.data.datasets[0].data = valores;
            graficoLinha.update();
            return;
        }

        graficoLinha = new Chart(document.getElementById('chart1'), {
            type: 'line',
            data: {
                labels: nomes,
                datasets: [
                    {
                        label: 'CO2',
                        data: valores,
                        borderColor: 'red',
                        tension: 0.4,
                        pointRadius: 4,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: 'red',
                        pointBorderWidth: 1,
                        fill: false
                    }, {
                        label: 'Minimo Ideal',
                        data: [20, 20, 20, 20, 20, 20, 20, 20, 20, 20],
                        borderColor: 'green',
                        tension: 0.4,
                        pointBorderColor: 'green',
                        borderDash: [5, 5],
                        pointBorderWidth: 2,
                        fill: -1
                    }, {
                        label: 'Maximo Ideal',
                        data: [40, 40, 40, 40, 40, 40, 40, 40, 40, 40],
                        borderColor: 'green',
                        tension: 0.4,
                        pointBorderColor: 'green',
                        borderDash: [5, 5],
                        pointBorderWidth: 2,
                        fill: false
                    }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        ticks: {
                            color: '#000'
                        }
                    },
                    x: {
                        ticks: {
                            color: '#000'
                        }
                    },
                }
            }
        });
    }



    function criarGraficoMeiaLua(co2Atual, restante) {

        if (graficoMeiaLua) {
            graficoMeiaLua.data.datasets[1].data = [co2Atual, restante];
            graficoMeiaLua.update();
            return;
        }

        graficoMeiaLua = new Chart(document.getElementById('chart2'), {
            type: 'doughnut',
            data: {
                labels: ['Nível atual de CO2', 'Máximo'],
                datasets: [{
                    label: 'Faixa Ideal',
                    data: [30, 70],
                    backgroundColor: ['transparent', 'transparent'],
                    weight: 0.01,
                    borderWidth: 3,
                    borderColor: 'green',
                    circumference: 36,
                    rotation: 306
                }, {
                    data: [co2Atual, restante], // PRIMEIRO PARAMETRO: NIVEL EM (%), SEGUNDO: 100 - NÍVEL (AMBOS EM PORCENTAGEM)
                    backgroundColor: ['#520606', '#e9e4e4'],
                    borderWidth: 0,
                    circumference: 180,
                    rotation: 270
                }, {
                    label: 'Faixa Ideal',
                    data: [1],
                    backgroundColor: ['transparent', 'transparent'],
                    weight: 0.02,
                    borderColor: 'green',
                    borderWidth: 3,
                    circumference: 36,
                    rotation: 306
                }
                ]
            },
            options: {
                aspectRatio: 1.5,
                plugins: {
                    legend: { display: false }
                }
            }
        });

    }


</script>
